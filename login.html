<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestroPro — Admin Panel</title>
    <link rel="stylesheet" href="login.css">

     
</head>
<body>

    <div class="login-card">
      <div class="brand-icon" style="background-color: #07111f; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; width: 50px; height: 50px;">
    <img src="photo_2026-08-10_08-51-08.jpg" alt="Logo" style="width: 100%; height: 100%; object-fit: cover;">
</div>
<br>
        <div class="brand-subtitle">RestroPro</div>
        <h1>Admin panel</h1>
        <p>Boshqaruv paneliga kirish uchun ma'lumotlaringizni kiriting.</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Login</label>
                <input type="text" id="username" placeholder="Admin login" required autocomplete="username">
            </div>

            <div class="input-group">
                <label>Parol</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="login-btn">Kirish →</button>
        </form>

        <a href="index.html" class="back-link">← Stolarga qaytish</a>
    </div>

 <script src="login.js"></script>
</body>
</html>
